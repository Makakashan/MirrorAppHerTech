services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY must be set in .env}
      AI_INVOKE_URL: ${AI_INVOKE_URL:-https://integrate.api.nvidia.com/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-stepfun-ai/step-3.7-flash}
      DATA_DIR: /app/data
    volumes:
      - ./backend/data:/app/data:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

<div class="layout" [class.layout--sidebar-collapsed]="sidebarCollapsed">
  <!-- Sidebar -->
  <aside
    class="sidebar"
    [class.sidebar--collapsed]="sidebarCollapsed"
    [style.width.px]="sidebarCollapsed ? 0 : sidebarWidth"
  >
    <div class="logo">
      <div class="logo-icon">M</div>
      <span class="logo-text">Mirror</span>
      <button
        class="sidebar-control"
        type="button"
        (click)="toggleSidebar()"
        aria-label="Hide sidebar"
      >
        <svg lucidePanelLeftClose size="17"></svg>
      </button>
    </div>

    <nav class="nav">
      <a
        class="nav-item"
        routerLink="/"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg lucideHouse size="18"></svg>
        <span>Home</span>
      </a>

      <a class="nav-item" routerLink="/analytics" routerLinkActive="nav-item--active">
        <svg lucideChartColumn size="18"></svg>
        <span>Analytics</span>
      </a>

      <a class="nav-item" routerLink="/calendar" routerLinkActive="nav-item--active">
        <svg lucideCalendarDays size="18"></svg>
        <span>Calendar</span>
      </a>

      <a class="nav-item" routerLink="/settings" routerLinkActive="nav-item--active">
        <svg lucideSettings size="18"></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar">
        <svg lucideUser size="18"></svg>
      </div>
      <div class="user-info">
        <p class="user-name">User</p>
        <p class="user-email">user&#64;example.com</p>
      </div>
    </div>
  </aside>

  @if (sidebarCollapsed) {
    <button
      class="sidebar-restore"
      type="button"
      (click)="toggleSidebar()"
      aria-label="Show sidebar"
    >
      <svg lucidePanelLeftOpen size="18"></svg>
    </button>
  }

  <!-- Main -->
  <div class="main">
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

<div class="calendar-page">
  <div class="calendar-inner">
    <section class="schedule-shell">
      <main class="month-panel">
        <div class="month-toolbar">
          <div class="month-nav">
            <button type="button" aria-label="Previous month">
              <svg lucideChevronLeft size="18"></svg>
            </button>
            <button type="button" aria-label="Next month">
              <svg lucideChevronRight size="18"></svg>
            </button>
          </div>

          <h2>{{ currentMonth }}</h2>

          <button class="view-btn" type="button" (click)="setView(view === 'month' ? 'week' : 'month')">
            <span>Show:</span>
            <strong>{{ view === 'month' ? 'Month' : 'Week' }}</strong>
            <svg lucideChevronDown size="16"></svg>
          </button>
        </div>

        <div class="mood-legend" aria-label="Mood legend">
          <span class="legend-great">Great</span>
          <span class="legend-good">Steady</span>
          <span class="legend-neutral">Mixed</span>
          <span class="legend-bad">Low</span>
        </div>

        <div class="weekdays">
          @for (weekday of weekdays; track weekday) {
            <span>{{ weekday }}</span>
          }
        </div>

        <div class="days-grid">
          @for (day of visibleDays; track day.id) {
            <button
              type="button"
              class="day"
              [class.day-great]="day.mood === 'great'"
              [class.day-good]="day.mood === 'good'"
              [class.day-neutral]="day.mood === 'neutral'"
              [class.day-bad]="day.mood === 'bad'"
              [class.day-future]="day.isFuture"
              [class.day-today]="day.isToday"
              [class.day-selected]="selectedDay.id === day.id"
              (click)="selectDay(day)"
            >
              <span class="day-number">{{ day.day }}</span>
              @if (!day.isFuture) {
                <span class="mood-chip">{{ moodLabel(day.mood) }}</span>
                <span class="entry-count">
                  {{ day.mood === 'great' ? '3' : day.mood === 'good' ? '2' : '1' }} entries
                </span>
              }
            </button>
          }
        </div>
      </main>
    </section>
  </div>
</div>

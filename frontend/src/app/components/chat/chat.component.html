<div class="chat">

  <header class="chat-header">
    <div class="header-left">
      <div class="bot-avatar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="13" rx="2"/>
          <path d="M8 8V6a4 4 0 018 0v2"/>
          <circle cx="9" cy="14" r="1" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="14" r="1" fill="currentColor" stroke="none"/>
          <path d="M12 3v3"/>
        </svg>
      </div>
      <span class="bot-name">Mirror Assistant</span>
    </div>
    <button class="recent-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>Recent chats</span>
    </button>
  </header>

  <div class="messages" #messagesEl>
    @for (msg of messages(); track msg.id) {
      <div class="message" [class.message--user]="msg.role === 'user'" [class.message--ai]="msg.role === 'ai'">
        <div class="bubble-wrap">
          <div class="bubble">{{ msg.text }}</div>
          <span class="time">{{ msg.time }}</span>
        </div>
      </div>
    }

    @if (isTyping()) {
      <div class="message message--ai">
        <div class="bubble-wrap">
          <div class="bubble bubble--typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="chat-footer">
    <button class="more-btn" aria-label="More options">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
      </svg>
    </button>
    <div class="input-wrap" [class.input-wrap--focused]="focused">
      <textarea
        class="chat-textarea"
        placeholder="Type a message..."
        [(ngModel)]="inputText"
        rows="1"
        (keydown)="onKeydown($event)"
        (focus)="focused = true"
        (blur)="focused = false"
      ></textarea>
      <button
        class="send-btn"
        (click)="send()"
        [disabled]="!inputText.trim()"
        aria-label="Send"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </div>

</div>

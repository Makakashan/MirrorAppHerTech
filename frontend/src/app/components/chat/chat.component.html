<div class="chat">

  <header class="chat-header">
    <div class="header-left">
      <div class="bot-avatar">
        <svg lucideBot size="20"></svg>
      </div>
      <span class="bot-name">Mirror Assistant</span>
    </div>
    <button class="recent-btn">
      <svg lucideClock3 size="14"></svg>
      <span>Recent chats</span>
    </button>
  </header>

  <div class="messages" #messagesEl>
    @for (msg of messages(); track msg.id) {
      <div class="message" [class.message--user]="msg.role === 'user'" [class.message--ai]="msg.role === 'ai'">
        <div class="bubble-wrap">
          <div class="bubble">{{ msg.text }}</div>
          <span class="time">{{ msg.time }}</span>
        </div>
      </div>
    }

    @if (isTyping()) {
      <div class="message message--ai">
        <div class="bubble-wrap">
          <div class="bubble bubble--typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="chat-footer">
    <button class="more-btn" aria-label="More options">
      <svg lucideEllipsis size="20"></svg>
    </button>
    <div class="input-wrap" [class.input-wrap--focused]="focused">
      <textarea
        class="chat-textarea"
        placeholder="Type a message..."
        [(ngModel)]="inputText"
        rows="1"
        (keydown)="onKeydown($event)"
        (focus)="focused = true"
        (blur)="focused = false"
      ></textarea>
      <button
        class="send-btn"
        (click)="send()"
        [disabled]="!inputText.trim()"
        aria-label="Send"
      >
        <svg lucideSend size="16"></svg>
      </button>
    </div>
  </div>

</div>

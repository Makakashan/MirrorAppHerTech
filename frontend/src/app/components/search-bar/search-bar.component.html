<div class="search-bar">
  <input
    class="search-input"
    type="text"
    placeholder="Type a message..."
    [value]="value"
    (input)="onInput($event)"
    (keydown.enter)="onSubmit()"
  />
  <button class="mic-btn" aria-label="Send message" (click)="onSubmit()">
    <img [src]="micIcon" alt="Send" />
  </button>
</div>

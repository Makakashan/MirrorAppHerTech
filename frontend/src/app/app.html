<div class="page">

  <div class="top">

    <!-- Navigation bar -->
    <nav class="navbar">
      <img [src]="menuIcon" alt="Menu" class="menu-icon" />
    </nav>

    <!-- Main content -->
    <div class="contents">

      <div class="hero">
        <div class="title-block">
          <p class="gradient-title">Understand yourself</p>
          <p class="gradient-title">Look into the Mirror</p>
        </div>
        <p class="subtitle">Talk freely and our AI will mirror your inner state</p>
      </div>

      <!-- Search bar -->
      <div class="search-bar">
        <input
          class="search-input"
          type="text"
          placeholder="I'm looking for..."
          [(ngModel)]="searchQuery"
        />
        <button class="mic-btn" aria-label="Voice input">
          <img [src]="micIcon" alt="Microphone" />
        </button>
      </div>

      <!-- Suggestion cards -->
      <div class="suggestions-section">
        <p class="suggestions-label">You may ask</p>
        <div class="cards">
          @for (card of suggestions; track card.textMain) {
            <div class="card">
              <div class="card-icon-wrap">
                <img [src]="card.icon" [alt]="card.textMain" class="card-icon" />
              </div>
              <p class="card-text">
                <span class="card-text--main">{{ card.textMain }} </span>
                <span class="card-text--secondary">{{ card.textSecondary }}</span>
              </p>
              <button class="ask-btn" (click)="askThis(card)">
                <span>Ask this</span>
                <img [src]="flashIcon" alt="" class="flash-icon" />
              </button>
            </div>
          }
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>Copyright &copy; 2024</span>
    <span>Terms and conditions</span>
  </footer>

</div>
